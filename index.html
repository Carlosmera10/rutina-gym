<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Técnica de los ejercicios</title>
<meta name="description" content="Técnica, alternativas y orden de los ejercicios de mi rutina de gimnasio.">
<meta name="theme-color" content="#15181B" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F3F4F5" media="(prefers-color-scheme: light)">
<link rel="manifest" href="app.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --floor:#F3F4F5; --deck:#FFFFFF; --line:#D9DDE1; --chalk:#16191C; --muted:#56606B;
  --p1:#D93A39; --p2:#2C66DB; --p3:#F2C230; --p4:#23885A; --p5:#FFFFFF;
  --on1:#FFFFFF; --on2:#FFFFFF; --on3:#1A1A12; --on4:#FFFFFF; --on5:#16191C;
  --caution:#B4540F; --alt:#1F6F4A; --alt-bg:#E6F3EC;
  --radius-s:8px; --radius-m:14px;
  --font:"Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --floor:#15181B; --deck:#1F2328; --line:#30363D; --chalk:#EEF0F2; --muted:#A3ADB8;
    --p5:#E9ECEF; --caution:#F0A35E; --alt:#7FD3A6; --alt-bg:#17302A;
  }
}
:root[data-theme="dark"]{
  --floor:#15181B; --deck:#1F2328; --line:#30363D; --chalk:#EEF0F2; --muted:#A3ADB8;
  --p5:#E9ECEF; --caution:#F0A35E; --alt:#7FD3A6; --alt-bg:#17302A;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--floor);color:var(--chalk);font-family:var(--font);font-size:17px;line-height:1.5;
  font-variation-settings:"wdth" 100;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--chalk);outline-offset:3px;border-radius:6px}

/* Barra de discos */
.rack{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--floor) 92%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  padding:10px 16px 8px;padding-top:max(10px,env(safe-area-inset-top))}
.plates{display:flex;justify-content:space-between;max-width:560px;margin:0 auto;gap:4px}
.plate{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:2px 0;cursor:pointer;min-width:0}
.disc{--c:var(--p1);--on:var(--on1);width:48px;height:48px;border-radius:50%;display:grid;place-items:center;
  border:4px solid var(--c);background:var(--deck);position:relative;
  font-weight:800;font-size:20px;font-variation-settings:"wdth" 70;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.disc::after{content:"";position:absolute;inset:6px;border-radius:50%;border:1.5px solid currentColor;opacity:.28}
.plate[aria-selected="true"] .disc{background:var(--c);color:var(--on);transform:scale(1.08)}
.plate-label{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;font-variation-settings:"wdth" 80}
.plate[aria-selected="true"] .plate-label{color:var(--chalk)}
.plate[data-k="piernas"] .disc{--c:var(--p1);--on:var(--on1)}
.plate[data-k="torso"] .disc{--c:var(--p2);--on:var(--on2)}
.plate[data-k="fullbody"] .disc{--c:var(--p3);--on:var(--on3)}
.plate[data-k="core"] .disc{--c:var(--p4);--on:var(--on4)}
.plate[data-k="guia"] .disc{--c:var(--p5);--on:var(--on5);border-color:var(--line)}
.plate[data-k="guia"][aria-selected="true"] .disc{border-color:var(--chalk)}

main{max-width:640px;margin:0 auto;padding:20px 16px 64px;padding-bottom:max(64px,env(safe-area-inset-bottom))}

/* Cabecera de día */
.day-head{padding:8px 0 18px;border-bottom:6px solid var(--accent);margin-bottom:8px}
.day-head h1{margin:0;font-size:56px;line-height:.95;font-weight:800;letter-spacing:-.5px;
  font-variation-settings:"wdth" 62;text-transform:none}
.day-meta{margin:10px 0 0;color:var(--muted);font-size:16px}
.day-note{margin:8px 0 0;font-size:16px}

/* Lista de ejercicios */
.ex{border-bottom:1px solid var(--line)}
.ex summary{list-style:none;display:grid;grid-template-columns:34px 1fr auto 18px;align-items:center;gap:12px;
  padding:14px 0;cursor:pointer;min-height:64px}
.ex summary::-webkit-details-marker{display:none}
.num{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-on);display:grid;place-items:center;
  font-weight:800;font-size:16px;font-variation-settings:"wdth" 70}
.ex-name{font-weight:700;font-size:18px;line-height:1.25;font-variation-settings:"wdth" 88}
.ex-sets{display:block;color:var(--muted);font-weight:500;font-size:15px;margin-top:2px;font-variation-settings:"wdth" 100}
.chip{font-size:13px;font-weight:700;padding:4px 9px;border-radius:999px;border:1.5px solid var(--line);white-space:nowrap;color:var(--muted)}
.chip.fixed{border-color:var(--chalk);color:var(--chalk)}
.chev{width:18px;height:18px;transition:transform .25s ease;color:var(--muted)}
.ex[open] .chev{transform:rotate(180deg)}
.ex.plain summary{cursor:default}
.ex.plain .chev{visibility:hidden}

.card{padding:4px 0 22px 46px}
.tagline{margin:0 0 14px;color:var(--muted);font-size:15px}
.card h3{margin:18px 0 8px;font-size:15px;font-weight:800;font-variation-settings:"wdth" 75;letter-spacing:.2px}
.card h3:first-of-type{margin-top:0}
.how{margin:0;padding-left:22px}
.how li{margin:0 0 8px;padding-left:4px}
.how li::marker{font-weight:800;color:var(--muted)}
.avoid{margin:0;padding:0;list-style:none;border-left:4px solid var(--caution);padding-left:14px}
.avoid li{margin:0 0 8px}
.alts{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.alts li{background:var(--alt-bg);color:var(--alt);font-weight:600;font-size:15px;padding:7px 12px;border-radius:var(--radius-s);line-height:1.3}
.ss{margin-top:16px;border:2px dashed var(--accent);border-radius:var(--radius-m);padding:10px 14px;font-size:15px}
.ss b{font-weight:800}
.order-help{margin-top:14px;color:var(--muted);font-size:15px}

/* Guía */
.guide h1{margin:8px 0 18px;font-size:56px;line-height:.95;font-weight:800;font-variation-settings:"wdth" 62;padding-bottom:18px;border-bottom:6px solid var(--chalk)}
.guide h2{font-size:28px;line-height:1.1;margin:34px 0 12px;font-weight:800;font-variation-settings:"wdth" 70}
.guide h3{font-size:17px;margin:18px 0 6px;font-weight:800}
.guide p{margin:0 0 10px}
.rules{margin:0;padding:0;list-style:none;counter-reset:r}
.rules li{counter-increment:r;padding:12px 0 12px 46px;position:relative;border-bottom:1px solid var(--line)}
.rules li::before{content:counter(r);position:absolute;left:0;top:12px;width:32px;height:32px;border-radius:50%;
  border:3px solid var(--chalk);display:grid;place-items:center;font-weight:800;font-size:15px}
.rules b{display:block}
.two{display:grid;gap:12px}
@media (min-width:560px){.two{grid-template-columns:1fr 1fr}}
.box{background:var(--deck);border:1px solid var(--line);border-radius:var(--radius-m);padding:14px 16px}
.box ul{margin:0;padding-left:20px}
.box li{margin-bottom:6px}
.box.stop{border-left:6px solid var(--p1)}
.box.go{border-left:6px solid var(--p4)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:700}
.signals{display:grid;gap:10px}
.signal{background:var(--deck);border:1px solid var(--line);border-radius:var(--radius-m);padding:12px 16px}
.signal b{display:block;margin-bottom:2px}
.foot{margin-top:40px;color:var(--muted);font-size:14px}
.theme-btn{margin-top:10px;background:var(--deck);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const ORDER_HELP = {
  "Fijo":"No cambies este ejercicio de sitio.",
  "Primero":"Siempre al empezar.",
  "Después":"Siempre después de la comba.",
};
function orderHelp(o){
  if (ORDER_HELP[o]) return ORDER_HELP[o];
  if (o.startsWith("↔")) return "Puedes intercambiarlo con el " + o.slice(1).trim().replace(", "," o el ") + " si la máquina está ocupada.";
  if (o.startsWith("Bloque")) return "Orden libre dentro del " + o.toLowerCase() + ".";
  if (o.startsWith("Tras")) return "Siempre después del ejercicio " + o.replace("Tras el ","") + ".";
  return "";
}

const TABS = ["piernas","torso","fullbody","core","guia"];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const chev = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

function renderPlates(active){
  const el = document.getElementById("plates");
  el.innerHTML = TABS.map(k => {
    const d = DAYS[k];
    const n = d ? d.n : "i";
    const label = d ? d.label : "Guía";
    return `<button class="plate" role="tab" data-k="${k}" aria-selected="${k===active}" aria-controls="main" id="tab-${k}">
      <span class="disc" aria-hidden="true">${n}</span><span class="plate-label">${label}</span></button>`;
  }).join("");
  el.querySelectorAll(".plate").forEach(b => b.addEventListener("click", () => go(b.dataset.k)));
}

function renderDay(k){
  const d = DAYS[k];

  m.style.setProperty("--accent-on", `var(--${d.on})`);
  const rows = d.rows.map(([n,id,name,sets,ord]) => {
    const chip = `<span class="chip ${ord==="Fijo"?"fixed":""}">${esc(ord)}</span>`;
    const head = `<span class="num" aria-hidden="true">${n}</span>
      <span class="ex-name">${esc(name)}<span class="ex-sets">${esc(sets)}</span></span>${chip}${chev}`;
    if (!id || !EX[id]) return `<div class="ex plain"><div style="display:grid;grid-template-columns:34px 1fr auto 18px;align-items:center;gap:12px;padding:14px 0;min-height:64px">${head}</div></div>`;
    const e = EX[id];

    return `<details class="ex" id="${k}-${id}" data-id="${id}">

      </div></details>`;
  }).join("");
  m.innerHTML = `<section aria-labelledby="tab-${k}">

  <p style="margin-top:14px">Progresar despacio y sin molestias siempre gana a progresar rápido con riesgo.</p>

  <p class="foot">Rutina basada en el registro de Hevy (octubre de 2026).<br>
  <button class="theme-btn" id="theme">Cambiar tema claro / oscuro</button></p>
  </section>`;
  document.getElementById("theme").addEventListener("click", toggleTheme);
}

function store(key, val){ try{ if (val===undefined) return localStorage.getItem(key); localStorage.setItem(key,val); }catch(e){ return null; } }
function toggleTheme(){
  const cur = document.documentElement.dataset.theme ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next; store("tecnica-gym:tema", next);
}

function go(k, exId){
  if (!TABS.includes(k)) k = "piernas";
  renderPlates(k);
  if (k === "guia") renderGuide(); else renderDay(k);
  store("tecnica-gym:pestana", k);
  const hash = exId ? `#${k}/${exId}` : `#${k}`;
  if (location.hash !== hash) history.replaceState(null, "", hash);
  if (exId){
    const det = document.getElementById(`${k}-${exId}`);
    if (det){ det.open = true; det.scrollIntoView({block:"start"}); }
  } else window.scrollTo(0,0);
}

(function init(){
  const t = store("tecnica-gym:tema"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
  const [k, id] = location.hash.slice(1).split("/");
  go(k || store("tecnica-gym:pestana") || "piernas", id);
  window.addEventListener("hashchange", () => { const [k2,id2] = location.hash.slice(1).split("/"); go(k2,id2); });
  // Desactiva el modo sin conexión de versiones anteriores, solo el de esta app
  // (las demás apps del mismo dominio no se tocan).
  if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => {
    if (/\/(rutina-gym|tecnica-gym)\//.test(r.scope)) r.unregister();
  })).catch(()=>{});
  if (window.caches) caches.keys().then(ks => ks.filter(k => k.startsWith("tecnica-")).forEach(k => caches.delete(k))).catch(()=>{});
})();
</script>
</body>
